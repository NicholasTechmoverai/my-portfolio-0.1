title: AI Template
description: This is a template for AI chat interface using Nuxt 3 and Pinia.

ai:
  name: AI
  fullName: Nicholas (AI)
  shortDescription: Talk to me!
  description: Talk to the AI version of Nicholas. I'll do my best to assist you with any questions or tasks — whether you need information, advice, or just want to have a conversation. Feel free to ask me anything!

startChat:
  title: "✨Start a conversation with Nicholas"
  description: "Ask me anything, and I'll do my best to assist you!"

input: 
  placeholder: "Ask something magical..."
  loading: "AI is thinking..."

randomPrompts:
  - "What is the meaning of life?"
  - "Can you tell me a joke?"
  - "What do you do in your free time?"
  - "Do you love memes?"
  - "What do you do for fun?"