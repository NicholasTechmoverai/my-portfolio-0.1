faq:
  title: Frequently Asked Questions
  description: Insights into how I think, work, and approach creative & technical tasks.
  categories:
    - title: My Approach & Process
      questions:
        - label: How do you approach a new task or project?
          content: |
            I start by breaking the task down into small, actionable steps. First, I clarify the goal (what “done” looks like). Then I research possible solutions, pick the simplest viable approach, and build a quick prototype or outline. I iterate based on feedback or self-review, and I always document my learnings along the way. For me, process is personal — I adapt it to fit the task, not the other way around.
        - label: What tools and methods do you use to stay organized?
          content: |
            I use a mix of digital and analog systems: a task board (like Trello or Notion) for tracking progress, a personal wiki for notes and decisions, and time-blocking for deep work. I also practice weekly reflection to see what worked and what didn’t. My goal is to reduce context switching and keep my mental energy focused.
        - label: How do you handle unfamiliar or hard problems?
          content: |
            I treat hard problems as learning opportunities. I start by defining what I don’t know, then break the problem into sub-questions. I use documentation, forums, and small experiments to test hypotheses. If I’m stuck, I simplify the problem or take a deliberate break. I’ve learned that patience and curiosity almost always unlock the next step.

    - title: Mindset & Motivation  (instead of Pricing)
      questions:
        - label: What keeps you motivated to finish difficult tasks?
          content: |
            I’m driven by curiosity and the small wins along the way. When a task feels overwhelming, I focus on completing just one tiny piece — that momentum usually carries me forward. I also keep a “done list” to remind myself of past challenges I’ve overcome. Ultimately, I love the feeling of turning chaos into clarity.
        - label: How do you balance quality vs. speed?
          content: |
            It depends on the goal. For learning or experimentation, speed wins — I allow myself to make mistakes. For portfolio pieces or client work, I prioritize quality and maintainability. My rule of thumb: never sacrifice clarity for speed if someone else (or future me) will need to understand the work later.
        - label: How do you measure success for a personal project?
          content: |
            Success isn’t always about metrics. For me, it’s often: “Did I learn something new?”, “Would I be proud to show this to a peer?”, or “Does this solve a real need I had?”. I also consider whether the project taught me a better way to work — because that skill carries into everything else I do.

    - title: About Me
      questions:
        - label: What do you enjoy most about building things?
          content: |
            I love the moment when a rough idea turns into something tangible — whether it’s a working interface, a script that automates a boring task, or a sketch that finally feels right. Building things gives me a sense of agency. I also enjoy the detective work of debugging or refining until everything clicks.
        - label: What do you do when you’re not working on a task?
          content: |
            I recharge by stepping away from screens: reading non-fiction, going for long walks, or tinkering with analog hobbies like sketching or mechanical keyboards. I also love sharing what I’ve learned with others — sometimes by writing short guides or chatting with fellow makers.